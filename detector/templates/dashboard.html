{% extends 'base.html' %}
{% block content %}

<h2 class="fw-semibold mb-4">Dashboard Overview</h2>

<div class="row g-4 mb-4">
    <div class="col-md-4">
        <div class="card p-3">
            <small class="text-muted">Last Assessment Score</small>
            <h4 class="mt-2">{{ last_score|default:"Not Taken" }}</h4>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3">
            <small class="text-muted">Total Journal Entries</small>
            <h4 class="mt-2">{{ total_entries }}</h4>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3">
            <small class="text-muted">Average Mood</small>
            <h4 class="mt-2">{{ avg_polarity|floatformat:2 }}</h4>
        </div>
    </div>
</div>

<div class="card p-4 mb-4">
    <h5 class="mb-3">Mood Trend</h5>
    <canvas id="moodChart" height="120"></canvas>
</div>

<div class="card p-4">
    <h5 class="mb-3">Assessment History</h5>
    <canvas id="assessmentChart" height="120"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
new Chart(document.getElementById('moodChart'), {
    type: 'line',
    data: {
        labels: {{ labels|default:"[]"|safe }},
        datasets: [{
            label: 'Mood Polarity',
            data: {{ data|default:"[]"|safe }},
            borderWidth: 2,
            tension: 0.3
        }]
    },
    options: {
        scales: { y: { min: -1, max: 1 } }
    }
});

new Chart(document.getElementById('assessmentChart'), {
    type: 'bar',
    data: {
        labels: {{ assess_labels|default:"[]"|safe }},
        datasets: [{
            label: 'Assessment Score',
            data: {{ assess_scores|default:"[]"|safe }}
        }]
    },
    options: {
        scales: { y: { min: 0, max: 30 } }
    }
});
</script>

{% endblock %}
