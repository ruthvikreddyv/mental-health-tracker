{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-5">
            <h3 class="fw-semibold text-center mb-4">Create Account</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-success w-100 mt-3">Sign Up</button>
            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="{% url 'login' %}">Login here</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
