{% extends 'base.html' %}
{% block content %}

<div class="card p-5 text-center">
    <h3 class="fw-semibold mb-3">Assessment Result</h3>

    <div class="alert alert-info">
        <h4>Score: {{ score }}</h4>
        <p>{{ message }}</p>
    </div>

    {% if ai_tip %}
    <div class="alert alert-warning">
        <p>{{ ai_tip }}</p>
    </div>
    {% endif %}

    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3">
        Go to Dashboard
    </a>
</div>

{% endblock %}
