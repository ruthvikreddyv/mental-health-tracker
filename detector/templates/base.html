<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mental Health Detector</title>

    <!-- Bootstrap + Font -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 600;
            font-size: 1.4rem;
        }
        .card {
            border-radius: 0.75rem;
            border: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
        }
        main.container {
            flex: 1;
        }
        footer {
            background-color: #212529;
            color: #bbb;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark py-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/">Mental Health Detector</a>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="{% url 'assessment' %}" class="btn btn-outline-light btn-sm me-2">Assessment</a>
                <a href="{% url 'journal' %}" class="btn btn-outline-light btn-sm me-2">Journal</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-success btn-sm">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            {% block content %}{% endblock %}
        </div>
    </div>
</main>

<footer class="text-center py-3 mt-auto">
    <small>&copy; 2025 Mental Health Detector</small>
</footer>

</body>
</html>
