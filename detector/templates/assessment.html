{% extends 'base.html' %}
{% block content %}

<div class="card p-5">
    <h3 class="fw-semibold mb-3">Mental Health Assessment</h3>
    <p class="text-muted mb-4">
        Answer based on how you have been feeling over the past two weeks.
    </p>

    <form method="post">
        {% csrf_token %}
        {% for num, question in questions.items %}
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Q{{ num }}. {{ question }}
                </label>
                {% for value, label in options %}
                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="q{{ num }}" value="{{ value }}" required>
                    <label class="form-check-label">{{ label }}</label>
                </div>
                {% endfor %}
            </div>
        {% endfor %}
        <button class="btn btn-success">Submit Assessment</button>
    </form>
</div>

{% endblock %}
