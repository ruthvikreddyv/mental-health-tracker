{% extends 'base.html' %}
{% block content %}

<div class="row g-4">

    <div class="col-lg-7">
        <div class="card p-4 mb-4">
            <h5 class="mb-3">Mood Trend</h5>
            <canvas id="moodChart" height="120"></canvas>
        </div>

        <div class="card p-4">
            <h5 class="mb-3">Past Entries</h5>
            {% for entry in entries %}
                <div class="border-bottom pb-2 mb-2">
                    <p class="mb-1">{{ entry.text }}</p>
                    <small class="text-muted">
                        Polarity: {{ entry.polarity|floatformat:2 }} · {{ entry.created_at }}
                    </small>
                </div>
            {% endfor %}
        </div>
    </div>

    <div class="col-lg-5">
        <div class="card p-4">
            <h5 class="mb-3">New Journal Entry</h5>
            <form method="post">
                {% csrf_token %}
                <textarea name="text" class="form-control mb-3" rows="6"
                          placeholder="Write about how you feel today..."></textarea>
                <button class="btn btn-primary w-100">Save Entry</button>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
new Chart(document.getElementById('moodChart'), {
    type: 'line',
    data: {
        labels: {{ labels|safe }},
        datasets: [{
            data: {{ data|safe }},
            borderWidth: 2,
            tension: 0.3
        }]
    },
    options: {
        scales: { y: { min: -1, max: 1 } }
    }
});
</script>

{% endblock %}
