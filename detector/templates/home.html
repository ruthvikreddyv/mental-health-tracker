{% extends 'base.html' %}
{% block content %}

<div class="card p-5 text-center">
    <h1 class="fw-semibold mb-3">Mental Health Detector</h1>
    <p class="text-muted mb-4">
        Track emotional well-being, analyze mood patterns, and gain insights
        through journaling and structured assessments.
    </p>

    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'assessment' %}" class="btn btn-success btn-lg">
            Start Assessment
        </a>
        {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-lg">
            View Dashboard
        </a>
        {% endif %}
    </div>
</div>

{% endblock %}
