{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="card p-4 mb-4">
            <h3 class="fw-semibold mb-2">Mental Health Chatbot</h3>
            <p class="text-muted mb-4">
                You may describe how you are feeling or ask for general mental well-being guidance.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <input
                        type="text"
                        name="message"
                        class="form-control"
                        placeholder="Type your message here..."
                        required
                    >
                    <button type="submit" class="btn btn-primary">
                        Send
                    </button>
                </div>
            </form>
        </div>

        {% if user_message %}
        <div class="card p-3 mb-3">
            <small class="text-muted">You</small>
            <p class="mb-0">{{ user_message }}</p>
        </div>

        <div class="card p-3 bg-light">
            <small class="text-muted">Chatbot Response</small>
            <p class="mb-0">{{ response }}</p>
        </div>
        {% endif %}

    </div>
</div>

{% endblock %}
